[package]
name = "actionkv"
version = "1.0.0"
authors = ["Tim McNamara <author@rustinaction.com>"]
edition = "2021"

[dependencies]
byteorder = "1.5" # <1>
crc = "1.8"       # <2>

[lib] # <3>
name = "libactionkv" # <3>
path = "src/lib.rs"  # <3>

[[bin]] # <4>
name = "akv_mem"
path = "src/akv_mem.rs"

[[bin]]
name = "akv_diskidx"
path = "src/akv_diskidx.rs"

[[bin]]
name = "akv_btree"
path = "src/akv_btree.rs"
