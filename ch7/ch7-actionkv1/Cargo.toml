[package]
name = "actionkv"
version = "1.0.0"
edition = "2021"

[dependencies]
crc = "3.2"
byteorder = "1.5"
serde = "1"
serde_derive = "1"

[lib]
name = "libactionkv"
path = "src/lib.rs"

[[bin]] # [[]] is needed because of TOML's array syntax. A crate may have multiple binaries, but only a single library.
name = "akv_mem"
path = "src/akv_mem.rs"
